<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f6f8">
<title>3-to-15</title>
<style>
:root{color-scheme:light;--bg:#f5f6f8;--paper:#fff;--ink:#222834;--muted:#737d8c;--line:#e3e7ed;--blue:#245fc9;--blue-bg:#eaf1ff;--red:#ba514b;--red-bg:#fcefed;--ease:cubic-bezier(.2,.75,.25,1)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:36px 22px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button{font:inherit;touch-action:manipulation}
button:focus-visible{outline:3px solid #759df2;outline-offset:4px}
main{width:min(100%,880px)}
.header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}
h1{font-size:clamp(38px,7vw,64px);font-weight:760;letter-spacing:-.065em;line-height:1;margin:0}
.rules{margin:13px 0 0;color:var(--muted);font-size:14px;line-height:1.8;max-width:550px}
.round{white-space:nowrap;color:var(--muted);font-size:13px;letter-spacing:.04em;padding-bottom:4px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:clamp(16px,4vw,36px);box-shadow:0 12px 40px #263b5e09}
.status{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;margin-bottom:22px}
.status-main{display:flex;align-items:center;gap:12px;min-width:0}
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--blue);transition:background .2s}
[data-phase="computer"] .dot{background:var(--red);animation:breathe 1.1s ease-in-out infinite}
[data-phase="draw"] .dot{background:#89919d}
[data-phase="player-win"] .dot{background:var(--blue)}
[data-phase="computer-win"] .dot{background:var(--red)}
.status-title{font-size:19px;font-weight:700;line-height:1.35;margin:0}
.status-note{font-size:12px;color:var(--muted);margin:4px 0 0;line-height:1.5}
.progress{display:flex;gap:4px;flex:none}
.progress i{width:7px;height:7px;border-radius:50%;background:#e6e9ee;transition:background .22s,transform .22s var(--ease)}
.progress i.used{background:#8a96a7;transform:scale(1.08)}
.pool{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:clamp(4px,1.2vw,11px);margin:0 0 28px}
.number{position:relative;aspect-ratio: .92;min-width:0;display:grid;place-items:center;background:#fafbfd;color:var(--ink);border:1px solid #dce2ea;border-radius:clamp(7px,1.5vw,13px);font-size:clamp(18px,4.3vw,36px);font-weight:650;cursor:pointer;transition:background .22s var(--ease),border-color .22s,color .22s,transform .18s var(--ease),box-shadow .18s;user-select:none}
@media(hover:hover){.number[aria-disabled="false"]:hover{background:#fff;border-color:#8eafea;box-shadow:0 5px 12px #245fc916;transform:translateY(-4px)}}
.number[aria-disabled="false"]:active{transform:translateY(0) scale(.94)}
.number[aria-disabled="true"]{cursor:default}
.number[data-owner="player"]{background:var(--blue-bg);color:var(--blue);border-color:#c6d9ff}
.number[data-owner="computer"]{background:var(--red-bg);color:var(--red);border-color:#f1cfcc}
.number[data-owner="none"][aria-disabled="true"]{color:#8d96a3}
.number.just-picked{animation:pick .3s var(--ease)}
.number.winning{box-shadow:inset 0 0 0 2px currentColor}
@keyframes pick{0%{transform:scale(.92)}65%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes breathe{0%,100%{opacity:.45;transform:scale(.85)}50%{opacity:1;transform:scale(1.25)}}
.owned{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hand{border:1px solid var(--line);border-radius:15px;padding:18px 16px 16px;min-width:0;transition:border-color .25s,background .25s;background:#fcfdfe}
.hand[data-side="player"]{--accent:var(--blue);--tint:var(--blue-bg)}
.hand[data-side="computer"]{--accent:var(--red);--tint:var(--red-bg)}
.hand.active{border-color:color-mix(in srgb,var(--accent) 44%,white)}
.hand.won{border-color:var(--accent);background:var(--tint)}
.hand-header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}
.hand-name{font-size:14px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:7px}
.hand-name::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.hand-count{color:var(--muted);font-size:12px;white-space:nowrap}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;min-height:38px}
.slot{aspect-ratio:1;max-height:62px;display:grid;place-items:center;border:1px dashed #dfe4eb;border-radius:9px;color:transparent;font-size:clamp(16px,3vw,27px);font-weight:650;min-width:0;transition:background .2s,border-color .2s,color .2s}
.slot.filled{background:var(--tint);border:1px solid transparent;color:var(--accent)}
.slot.enter{animation:arrive .28s var(--ease) both}
.slot.winning{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
@keyframes arrive{from{opacity:0;transform:translateY(7px) scale(.86)}to{opacity:1;transform:translateY(0) scale(1)}}
.bottom{display:flex;align-items:center;justify-content:space-between;gap:18px;border-top:1px solid var(--line);margin-top:26px;padding-top:24px}
.stats{display:flex;gap:clamp(18px,4vw,38px);margin:0}
.stats div{display:grid;gap:3px}
.stats dt{color:var(--muted);font-size:12px;white-space:nowrap}
.stats dd{margin:0;font-size:24px;font-weight:700;line-height:1.15}
.stats div:first-child dd{color:var(--blue)}
.stats div:last-child dd{color:var(--red)}
.restart{border:1px solid #dce2ea;background:#fff;color:var(--ink);padding:12px 19px;border-radius:10px;min-height:44px;font-size:14px;font-weight:650;cursor:pointer;white-space:nowrap;transition:background .2s,transform .18s var(--ease),border-color .2s,color .2s}
.restart:hover{border-color:#a1aab7;background:#f7f9fb}
.restart:active{transform:scale(.96)}
.restart.ready{background:var(--ink);color:white;border-color:var(--ink)}
.restart.ready:hover{background:#3b4556}
@media(max-width:550px){body{padding:24px 12px}.header{align-items:flex-start;margin-bottom:18px;gap:8px}.round{padding-top:8px;font-size:11px}.rules{font-size:12px}.panel{border-radius:16px}.status{margin-bottom:16px}.status-title{font-size:17px}.progress{gap:3px}.progress i{width:5px;height:5px}.pool{margin-bottom:20px}.number{aspect-ratio:.7}.owned{gap:8px}.hand{padding:12px 8px}.hand-header{margin-bottom:12px}.hand-name{font-size:12px}.hand-count{font-size:11px}.slots{gap:3px;min-height:24px}.slot{border-radius:5px}.bottom{margin-top:20px;padding-top:18px;gap:8px}.stats{gap:13px}.stats dt{font-size:10px}.stats dd{font-size:20px}.restart{font-size:12px;padding:10px 12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<header class="header">
  <div><h1>3-to-15</h1><p class="rules">双方轮流从1～9中选择一个未被选过的数字，率先取得任意三个和为15的数字者获胜。</p></div>
  <div class="round" id="round">第 01 局</div>
</header>
<section class="panel" id="panel" data-phase="player" aria-label="对弈区域">
  <div class="status">
    <div class="status-main"><span class="dot" aria-hidden="true"></span><div role="status" aria-live="polite" aria-atomic="true"><p class="status-title" id="statusTitle">轮到你了</p><p class="status-note" id="statusNote">请选择一个数字。</p></div></div>
    <div class="progress" id="progress" aria-label="已选择0个数字"></div>
  </div>
  <div class="pool" id="pool" role="group" aria-label="可选数字"></div>
  <div class="owned">
    <section class="hand active" id="playerHand" data-side="player" aria-label="玩家已取得的数字">
      <div class="hand-header"><span class="hand-name">你</span><span class="hand-count" id="playerCount">0 个数字</span></div>
      <div class="slots" id="playerSlots"></div>
    </section>
    <section class="hand" id="computerHand" data-side="computer" aria-label="计算机已取得的数字">
      <div class="hand-header"><span class="hand-name">计算机</span><span class="hand-count" id="computerCount">0 个数字</span></div>
      <div class="slots" id="computerSlots"></div>
    </section>
  </div>
  <div class="bottom">
    <dl class="stats" aria-label="本次会话对局统计">
      <div><dt>你的胜场</dt><dd id="playerScore">0</dd></div>
      <div><dt>平局</dt><dd id="drawScore">0</dd></div>
      <div><dt>计算机胜场</dt><dd id="computerScore">0</dd></div>
    </dl>
    <button class="restart" id="restart" type="button">重新开始</button>
  </div>
</section>

</main>
<script>
"use strict";
const engine=(function createEngine(){
  const full=511, wins=[];
  for(let a=1;a<=9;a++)for(let b=a+1;b<=9;b++)for(let c=b+1;c<=9;c++)if(a+b+c===15)wins.push((1<<(a-1))|(1<<(b-1))|(1<<(c-1)));
  const bit=n=>1<<(n-1);
  const won=m=>wins.some(w=>(m&w)===w);
  const winningMask=m=>wins.find(w=>(m&w)===w)||0;
  const count=m=>{let k=0;while(m){m&=m-1;k++;}return k;};
  const outcome=(p,c)=>won(p)?"player":won(c)?"computer":(p|c)===full?"draw":null;
  const cache=new Map();
  function minimax(p,c,computerTurn){
    const terminal=outcome(p,c), depth=count(p|c);
    if(terminal==="computer")return 10-depth;
    if(terminal==="player")return depth-10;
    if(terminal==="draw")return 0;
    const key=p|(c<<9)|(computerTurn?1<<18:0);
    if(cache.has(key))return cache.get(key);
    let best=computerTurn?-Infinity:Infinity;
    for(let n=1;n<=9;n++){
      const b=bit(n);if((p|c)&b)continue;
      const score=computerTurn?minimax(p,c|b,false):minimax(p|b,c,true);
      best=computerTurn?Math.max(best,score):Math.min(best,score);
    }
    cache.set(key,best);return best;
  }
  function bestMoves(p,c){
    if(outcome(p,c))return [];
    let best=-Infinity,moves=[];
    for(let n=1;n<=9;n++){
      const b=bit(n);if((p|c)&b)continue;
      const score=minimax(p,c|b,false);
      if(score>best){best=score;moves=[n];}else if(score===best)moves.push(n);
    }
    return moves;
  }
  return {bit,won,winningMask,outcome,bestMoves,minimax,wins};
})();
const $=id=>document.getElementById(id);
const pool=$("pool"), panel=$("panel"), restart=$("restart");
const buttons=[], progress=[], slots={player:[],computer:[]};
const score={player:0,draw:0,computer:0};
let p=0,c=0,order={player:[],computer:[]},phase="player",result=null,round=1,timer=null,generation=0;
for(let n=1;n<=9;n++){
  const el=document.createElement("button");
  el.type="button";el.className="number";el.textContent=n;el.dataset.owner="none";el.setAttribute("aria-disabled","false");
  el.addEventListener("click",()=>choose(n,"player"));
  pool.append(el);buttons.push(el);
  const dot=document.createElement("i");dot.setAttribute("aria-hidden","true");$("progress").append(dot);progress.push(dot);
}
for(const side of ["player","computer"]){
  for(let i=0;i<5;i++){
    const el=document.createElement("span");el.className="slot";el.setAttribute("aria-hidden","true");
    $(side+"Slots").append(el);slots[side].push(el);
  }
}
function winnerNumbers(mask){
  return Array.from({length:9},(_,i)=>i+1).filter(n=>mask&engine.bit(n));
}
function render(last=null){
  const winMask=result==="player"?engine.winningMask(p):result==="computer"?engine.winningMask(c):0;
  for(let i=0;i<9;i++){
    const n=i+1,b=engine.bit(n),el=buttons[i],owner=p&b?"player":c&b?"computer":"none";
    el.dataset.owner=owner;
    el.setAttribute("aria-disabled",String(phase!=="player"||owner!=="none"));
    el.setAttribute("aria-label",n+(owner==="player"?"，你已选取":owner==="computer"?"，计算机已选取":"，未选取"));
    el.classList.toggle("winning",Boolean(winMask&b));
    el.classList.toggle("just-picked",last===n);
    progress[i].classList.toggle("used",i<order.player.length+order.computer.length);
  }
  $("progress").setAttribute("aria-label","已选择"+(order.player.length+order.computer.length)+"个数字");
  for(const side of ["player","computer"]){
    const hand=$(side+"Hand");
    hand.classList.toggle("active",phase===side);
    hand.classList.toggle("won",result===side);
    $(side+"Count").textContent=order[side].length+" 个数字";
    hand.setAttribute("aria-label",(side==="player"?"你":"计算机")+"已取得："+(order[side].join("、")||"无"));
    slots[side].forEach((el,i)=>{
      const n=order[side][i],filled=n!==undefined;
      el.textContent=filled?n:"";
      el.classList.toggle("filled",filled);
      el.classList.toggle("enter",filled&&last===n);
      el.classList.toggle("winning",filled&&result===side&&Boolean(winMask&engine.bit(n)));
    });
  }
  let title,note;
  if(result==="draw"){title="平局";note="所有数字均已选完，双方都未达成15。";}
  else if(result){title=result==="player"?"你赢了！":"计算机获胜";note=winnerNumbers(winMask).join(" + ")+" = 15";}
  else if(phase==="computer"){title="计算机正在思考…";note="请稍候，下一回合即将开始。";}
  else{title="轮到你了";note="请选择一个数字。";}
  panel.dataset.phase=result&&result!=="draw"?result+"-win":result||phase;
  $("statusTitle").textContent=title;$("statusNote").textContent=note;
  restart.classList.toggle("ready",Boolean(result));restart.textContent=result?"再来一局":"重新开始";
  $("round").textContent="第 "+String(round).padStart(2,"0")+" 局";
  for(const side of ["player","draw","computer"])$(side+"Score").textContent=score[side];
}
function choose(n,side){
  if(result||phase!==side||n<1||n>9)return;
  const b=engine.bit(n);if((p|c)&b)return;
  if(side==="player")p|=b;else c|=b;
  order[side].push(n);
  result=engine.outcome(p,c);
  if(result){phase="finished";score[result]++;render(n);return;}
  phase=side==="player"?"computer":"player";
  render(n);
  if(phase==="computer"){
    const ticket=generation;
    timer=setTimeout(()=>{
      timer=null;
      if(ticket!==generation||phase!=="computer"||result)return;
      const moves=engine.bestMoves(p,c);
      if(moves.length)choose(moves[Math.floor(Math.random()*moves.length)],"computer");
    },800+Math.random()*1000);
  }
}
function newRound(){
  generation++;clearTimeout(timer);timer=null;
  if(result||p||c)round++;
  p=0;c=0;order={player:[],computer:[]};phase="player";result=null;render();
}
restart.addEventListener("click",newRound);
document.addEventListener("keydown",e=>{
  if(e.repeat||e.ctrlKey||e.altKey||e.metaKey||e.shiftKey)return;
  if(/^[1-9]$/.test(e.key)){e.preventDefault();choose(Number(e.key),"player");}
});
render();
// Warm the tiny state cache during idle time; game interactions never wait for it.
if("requestIdleCallback" in window)requestIdleCallback(()=>engine.minimax(0,0,false),{timeout:1000});
</script>
</body>
</html>
